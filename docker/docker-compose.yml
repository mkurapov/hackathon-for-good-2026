# Run from the repo root: docker compose -f docker/docker-compose.yml up -d --build
# The project name is pinned so volume names stay the same as before this file moved.
name: hackathon-for-good-2026

services:
  api:
    build: ../backend
    env_file:
      - path: ../.env
        required: false
    volumes:
      - groundtruth-data:/data
    restart: unless-stopped

  dashboard:
    build:
      context: ../analyst-dashboard
      additional_contexts:
        docker: .
    ports:
      - "8080:80"
    env_file:  
      - path: ../.env
        required: false
    depends_on:
      - api
    restart: unless-stopped

volumes:
  groundtruth-data:
