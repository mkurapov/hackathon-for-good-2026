# Rendered by the nginx image's envsubst step: only ${ANALYST_API_KEY} and ${API_UPSTREAM}
# are replaced; nginx's own $variables are left alone.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Analyst API. nginx adds the shared key so it never ships in the JS bundle.
    location /api/ {
        proxy_pass ${API_UPSTREAM}/;
        proxy_set_header Host $host;
        proxy_set_header X-Analyst-Key "${ANALYST_API_KEY}";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
