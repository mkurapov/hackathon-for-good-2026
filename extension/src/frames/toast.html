<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../lib/ui.css">
<link rel="stylesheet" href="frame.css">
<style>
  /* Room for the shadow (0 6px 20px). */
  body { padding: 16px 24px 34px; }
  .toast { width: 336px; background: #fff; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.25); overflow: hidden; border-top: 4px solid var(--navy); }
  /* The page fades the whole frame in (see showToast in article.js); this fades the card out. */
  .toast { transition: opacity .3s ease-in, transform .3s ease-in; }
  .toast.leaving { opacity: 0; transform: translateY(8px); }
  @media (prefers-reduced-motion: reduce) { .toast.leaving { transform: none; } }
  .t-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 0; }
  .t-head .logo { height: 24px; }
  .t-body { padding: 6px 12px 12px; font-size: 15px; }
  .t-actions { display: flex; gap: 6px; margin-top: 10px; }
  .t-actions .btn { font-size: 14px; }
  .t-actions > * { flex: 1; }
  .t-more { display: flex; gap: 14px; margin-top: 10px; font-size: 15px; }
  .close { margin-left: auto; background: none; border: 0; font-size: 22px; color: var(--muted); cursor: pointer; line-height: 1; padding: 0 2px; }
  .chip { margin: 0; font-size: 13px; max-width: 210px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="toast" id="root"></div>
<script type="module" src="toast.js"></script>
</body>
</html>
